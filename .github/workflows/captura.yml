name: Captura de la interfaz

# Solo para revisar el diseño: abre el programa con datos de ejemplo en Windows y guarda una captura.
# No publica nada.
on:
  push:
    branches: [ui]
  workflow_dispatch:

jobs:
  captura:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pantalla 1920x1080 (si se puede)
        shell: pwsh
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Captura
        shell: pwsh
        run: |
          python -m pip install --upgrade pip numpy pillow
          python app.py --demo-screenshot captura.png
          if (!(Test-Path captura.png)) { throw "No hay captura" }
      - uses: actions/upload-artifact@v4
        with:
          name: captura
          path: captura.png
