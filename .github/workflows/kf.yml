name: Muestras killfeed
on:
  push:
    branches: [kf-muestras]
permissions:
  contents: write
jobs:
  kf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q yt-dlp numpy pillow
      - name: Prueba
        run: |
          bash tools/v18.sh
          mkdir -p out/agents
          curl -s "https://valorant-api.com/v1/agents?isPlayableCharacter=true" -o out/agents/agents.json
          python - <<'PY'
          import json, urllib.request
          d = json.load(open("out/agents/agents.json"))["data"]
          for a in d:
              for k in ("killfeedPortrait", "displayIconSmall"):
                  u = a.get(k)
                  if u:
                      urllib.request.urlretrieve(u, f"out/agents/{a['displayName'].replace('/', '')}_{k}.png")
          PY
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan kf-resultado
          git rm -rf --cached . > /dev/null || true
          git add -f out
          git commit -qm "prueba"
          git push -f origin kf-resultado
