name: Muestras killfeed
on:
  push:
    branches: [kf-muestras]
permissions:
  contents: write
jobs:
  kf:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q yt-dlp
      - name: Trozos del VOD (rondas sin killfeed)
        run: |
          mkdir -p out/r4
          for r in 1499-1508 8184-8194 8158-8164 4018-4027; do
            a=${r%-*}; b=${r#*-}
            yt-dlp -q -f "b/bv*" -S "res,fps" --download-sections "*$a-$b" -o "t_$a.mp4" "https://www.twitch.tv/videos/2939461539" || true
            ffmpeg -loglevel error -i "t_$a.mp4" -vf "fps=4,crop=iw*0.31:ih*0.22:iw*0.685:ih*0.035" "out/r4/s${a}_%03d.png" || true
          done
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 t_1499.mp4 > out/info.txt || true
          ls out/r4 | wc -l
      - name: Guardar
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan kf-resultado
          git rm -rf --cached . > /dev/null || true
          git add -f out
          git commit -qm "muestras"
          git push -f origin kf-resultado
