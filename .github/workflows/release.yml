name: Publicar versión

# Cada vez que llega a main un version.py con un número nuevo:
#  1) se crea la Release vX.Y.Z con VortexsClips.zip (código, para instalaciones antiguas)
#  2) se construye en Windows VortexsClips-Setup.exe (programa + ffmpeg) y se añade a la Release
on:
  push:
    branches: [main]
    paths: ["version.py", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      ver: ${{ steps.v.outputs.ver }}
      skip: ${{ steps.exists.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Leer versión
        id: v
        run: |
          VER=$(python3 -c "import version; print(version.VERSION)")
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: ¿Ya existe?
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Ya publicada."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Retratos de agentes al día (para el killfeed; los nuevos agentes entran solos)
        shell: pwsh
        continue-on-error: true
        run: python tools/retratos.py

      - name: Construir el programa (.exe)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller numpy pillow
          pyinstaller --noconfirm --clean --windowed --onedir --name VortexsClips `
            --icon icon.ico --add-data "icon.ico;." --hidden-import numpy --hidden-import PIL --hidden-import PIL.Image --hidden-import publish --hidden-import ui --hidden-import semana --hidden-import killfeed --hidden-import drive --hidden-import avisos --add-data "fonts;fonts" --add-data "agentes;agentes" --add-data "logo.png;." app.py
          if (!(Test-Path dist\VortexsClips\VortexsClips.exe)) { throw "No se generó el .exe" }

      - name: Paquete de actualización rápida (solo el programa)
        shell: pwsh
        run: |
          # «huella» de todo lo que NO es el programa (Python, numpy, PyInstaller, fuentes…): si en la
          # versión instalada es la misma, basta con cambiar VortexsClips.exe (unos MB, no ~80)
          $base = (Resolve-Path dist\VortexsClips\_internal).Path
          $lines = Get-ChildItem $base -Recurse -File | Sort-Object FullName | ForEach-Object { $_.FullName.Substring($base.Length) + ":" + $_.Length }
          $lines += "python:" + (python -c "import sys;print(sys.version)")
          $lines += "pyinstaller:" + (python -c "import PyInstaller;print(PyInstaller.__version__)")
          $bytes = [Text.Encoding]::UTF8.GetBytes(($lines -join "`n"))
          $h = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($bytes)).Replace("-","")
          Set-Content -NoNewline -Encoding ascii dist\VortexsClips\deps.txt $h
          Copy-Item dist\VortexsClips\deps.txt dist\VortexsClips-deps.txt
          Compress-Archive -Path dist\VortexsClips\VortexsClips.exe, dist\VortexsClips\deps.txt -DestinationPath dist\VortexsClips-app.zip -Force
          Write-Host "huella $h"; Get-Item dist\VortexsClips-app.zip | Select-Object Length
          # Windows deja renombrar un programa en marcha (así se cambia sin cerrar el instalador)
          Copy-Item "$env:WINDIR\System32\PING.EXE" "$env:TEMP\prueba.exe"
          $pr = Start-Process "$env:TEMP\prueba.exe" -ArgumentList "-n","20","127.0.0.1" -PassThru -WindowStyle Hidden
          Start-Sleep 2
          if ($pr.HasExited) { throw "La prueba no quedó en marcha" }
          Rename-Item "$env:TEMP\prueba.exe" "prueba.old.exe"
          if (!(Test-Path "$env:TEMP\prueba.old.exe")) { throw "No se pudo renombrar un programa en marcha" }
          Stop-Process $pr.Id -Force

      - name: Descargar ffmpeg
        shell: pwsh
        run: |
          $u = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Invoke-WebRequest $u -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffx
          $bin = Get-ChildItem ffx -Recurse -Directory -Filter bin | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg\bin | Out-Null
          Copy-Item "$($bin.FullName)\*" ffmpeg\bin -Recurse
          if (!(Test-Path ffmpeg\bin\ffplay.exe)) { throw "Falta ffplay" }
          ffmpeg\bin\ffmpeg.exe -hide_banner -filters | Select-String " ass "

      - name: Descargar transcriptor (whisper.cpp v1.8.2)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/ggml-org/whisper.cpp/releases/download/v1.8.2/whisper-bin-x64.zip" -OutFile w.zip
          Expand-Archive w.zip -DestinationPath whisper
          $cli = Get-ChildItem whisper -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (!$cli) { throw "No viene whisper-cli.exe" }
          Write-Host "whisper-cli: $($cli.FullName)"

      - name: Autoprueba del programa empaquetado
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\VortexsClips\ffmpeg\bin | Out-Null
          Copy-Item ffmpeg\bin\* dist\VortexsClips\ffmpeg\bin -Recurse
          Copy-Item whisper dist\VortexsClips\whisper -Recurse
          $p = Start-Process dist\VortexsClips\VortexsClips.exe -ArgumentList "--selftest","$pwd\selftest.txt" -PassThru -Wait
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "La autoprueba ha fallado" }

      - name: Autoprueba de los subtítulos
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $es = $s.GetInstalledVoices() | Where-Object { $_.VoiceInfo.Culture.Name -like "es*" } | Select-Object -First 1
          if ($es) { $s.SelectVoice($es.VoiceInfo.Name) }
          $s.SetOutputToWaveFile("$pwd\voz.wav")
          $pb = New-Object System.Speech.Synthesis.PromptBuilder
          $pb.AppendBreak([TimeSpan]::FromSeconds(2))
          $pb.AppendText("Hola, esto es una prueba de los subtitulos de Vortexs Clips.")
          $pb.AppendBreak([TimeSpan]::FromSeconds(4))
          $pb.AppendText("Mira esta jugada, tres kills seguidas.")
          $s.Speak($pb)
          $s.Dispose()
          $p = Start-Process dist\VortexsClips\VortexsClips.exe -ArgumentList "--selftest-subs","$pwd\voz.wav","$pwd\subs.txt","--gpu-test" -PassThru -Wait
          Get-Content subs.txt
          Remove-Item dist\VortexsClips\ffmpeg -Recurse -Force
          Remove-Item dist\VortexsClips\whisper -Recurse -Force
          if ($p.ExitCode -ne 0) { throw "La prueba de subtítulos ha fallado" }

      - name: Crear instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ needs.check.outputs.ver }}" installer.iss
          if (!(Test-Path dist\VortexsClips-Setup.exe)) { throw "No se generó el instalador" }

      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: |
            dist/VortexsClips-Setup.exe
            dist/VortexsClips-app.zip
            dist/VortexsClips-deps.txt

  publish:
    needs: [check, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: setup
          path: out
      - name: Modelo de voz en GitHub (para redes donde HuggingFace está bloqueado)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view modelo-voz -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            curl -fL -o ggml-small-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
            gh release create modelo-voz ggml-small-q5_1.bin -R "$GITHUB_REPOSITORY" --prerelease \
              --title "Modelo de voz (subtítulos)" --notes "Modelo whisper.cpp small q5_1 que descarga Vortexs Clips la primera vez que genera subtítulos."
          fi
      - name: Empaquetar código
        run: |
          mkdir -p dist/VortexsClips
          cp -r *.py icon.ico logo.png fonts agentes Instalar.bat Iniciar.bat README.md dist/VortexsClips/
          cd dist && zip -r VortexsClips.zip VortexsClips
      - name: Crear Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub a veces da error 500/502 al crearla: se reintenta (y si llegó a crearse, se completa)
          T="${{ needs.check.outputs.tag }}"
          for i in 1 2 3 4 5 6; do
            if gh release view "$T" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$T" dist/VortexsClips.zip out/VortexsClips-Setup.exe out/VortexsClips-app.zip out/VortexsClips-deps.txt --clobber -R "$GITHUB_REPOSITORY" && \
                gh release edit "$T" --draft=false --latest -R "$GITHUB_REPOSITORY" && exit 0
            elif gh release create "$T" dist/VortexsClips.zip out/VortexsClips-Setup.exe out/VortexsClips-app.zip out/VortexsClips-deps.txt \
                --target "$GITHUB_SHA" --title "Vortexs Clips $T" --generate-notes; then
              exit 0
            fi
            echo "Reintento $i…"; sleep 30
          done
          exit 1
